[project]
name = "portfolio-risk-decision-engine"
version = "0.1.0"
description = "Illustrative ETF portfolio risk analytics and constrained decision support"
readme = "README.md"
authors = [
    { name = "OliviaLi22", email = "119539921+OliviaLi22@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.9.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "yfinance>=1.8.0",
]

[project.scripts]
portfolio-risk-decision-engine = "portfolio_risk_decision_engine.run_analysis:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
